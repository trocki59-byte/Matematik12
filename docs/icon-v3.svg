<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#2a3580"/>
      <stop offset="0.5" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#070a16"/>
    </radialGradient>
    <linearGradient id="sig" x1="160" y1="120" x2="370" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c7d2ff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ring" x1="60" y1="80" x2="452" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

  <!-- Arka yörünge (Σ'nın arkasından geçer) -->
  <ellipse cx="256" cy="256" rx="196" ry="92" transform="rotate(-24 256 256)"
           fill="none" stroke="url(#ring)" stroke-width="14" stroke-opacity="0.55"/>

  <!-- Ana işaret: Σ -->
  <path d="M 356 146 H 184 L 292 256 L 184 366 H 356"
        fill="none" stroke="url(#sig)" stroke-width="50"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Ön yörünge parçası (Σ'nın önünden geçer) -->
  <path d="M 256 256 m -196 0 a 196 92 0 0 0 392 0"
        transform="rotate(-24 256 256)" fill="none" stroke="url(#ring)" stroke-width="14"
        stroke-linecap="round" opacity="0"/>

  <!-- Yörünge üzerinde parlayan nokta -->
  <circle cx="420" cy="158" r="18" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="414" cy="152" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
