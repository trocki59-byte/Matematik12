<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="0.55" stop-color="#0f1632"/>
      <stop offset="1" stop-color="#0b0f1e"/>
    </radialGradient>
    <linearGradient id="mark" x1="150" y1="130" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5b4ff"/>
      <stop offset="0.55" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Koyu zemin ve yumuşak ışıma -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Ana işaret: Σ (toplam) -->
  <path d="M 362 142 H 178 L 296 256 L 178 370 H 362"
        fill="none" stroke="url(#mark)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- Küçük matematik işaretleri -->
  <g fill="none" stroke-linecap="round" stroke-width="16">
    <path d="M 404 92 V 124 M 388 108 H 420" stroke="#22d3ee"/>
    <path d="M 96 390 L 120 414 M 120 390 L 96 414" stroke="#7c8cff"/>
  </g>
  <circle cx="92" cy="112" r="11" fill="#fbbf24"/>
  <circle cx="428" cy="398" r="9" fill="#4ade80"/>
</svg>
