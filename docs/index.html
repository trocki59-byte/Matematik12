<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Matematik 1–4</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f7fb;color:#1f2937;display:flex;justify-content:center;min-height:100vh;padding:16px}
.app{width:100%;max-width:480px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:20px;align-self:flex-start}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:#6b7280;margin:0 0 16px;font-size:.95rem}
h2{font-size:1.05rem;margin:18px 0 8px;color:#1d4ed8}
.topics{display:grid;grid-template-columns:1fr;gap:8px}
.topics button{padding:12px 14px;border:2px solid #e5e7eb;background:#fff;border-radius:12px;font-size:.98rem;cursor:pointer;text-align:left}
.topics button.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600}
.card{background:#f9fafb;border-radius:14px;padding:20px;text-align:center}
.question{font-size:2rem;font-weight:700;letter-spacing:1px;margin:8px 0 16px}
input{width:100%;font-size:1.5rem;padding:12px;text-align:center;border:2px solid #d1d5db;border-radius:12px}
input:focus{outline:none;border-color:#2563eb}
.btn{width:100%;margin-top:12px;padding:14px;font-size:1.1rem;border:none;border-radius:12px;background:#2563eb;color:#fff;cursor:pointer}
.btn.secondary{background:#e5e7eb;color:#111827}
.feedback{margin-top:14px;padding:12px;border-radius:12px;font-size:1rem;display:none;text-align:left}
.ok{background:#dcfce7;color:#166534}
.bad{background:#fee2e2;color:#991b1b}
.steps{margin:8px 0 0;padding-left:20px;font-size:.95rem;line-height:1.6}
.stats{display:flex;justify-content:space-between;margin-top:16px;font-size:.9rem;color:#4b5563}
.stats b{color:#111827}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>Matematik 1–4</h1>
  <p class="sub">Sınıf ve konu seç, sorulara başla.</p>
  <div id="topics"></div>

  <div class="card">
    <div id="qText" class="question">Bir konu seçin</div>
    <input id="answer" type="text" inputmode="numeric" placeholder="Cevap" autocomplete="off" disabled>
    <button id="checkBtn" class="btn" disabled>Kontrol Et</button>
    <button id="nextBtn" class="btn secondary hidden">Sonraki Soru</button>
    <div id="feedback" class="feedback"></div>
  </div>

  <div class="stats">
    <span>Doğru: <b id="correctCount">0</b></span>
    <span>Toplam: <b id="totalCount">0</b></span>
    <span>Başarı: <b id="rate">-</b></span>
  </div>
</div>

<script>
// ---------- Yardımcılar ----------
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

// ---------- Adım adım çözüm ----------
function addSteps(a, b) {
  const s = [];
  const o = a % 10 + b % 10, c1 = o >= 10 ? 1 : 0;
  s.push(`Birler: ${a % 10} + ${b % 10} = ${o}` + (c1 ? ` → ${o - 10} yazılır, 1 elde edilir` : ""));
  const t = Math.floor(a / 10) % 10 + Math.floor(b / 10) % 10 + c1, c2 = t >= 10 ? 1 : 0;
  s.push(`Onlar: ${Math.floor(a / 10) % 10} + ${Math.floor(b / 10) % 10}` + (c1 ? " + 1 (elde)" : "") + ` = ${t}` + (c2 ? ` → ${t - 10} yazılır, 1 elde edilir` : ""));
  s.push(`Yüzler: ${Math.floor(a / 100)} + ${Math.floor(b / 100)}` + (c2 ? " + 1 (elde)" : "") + ` = ${Math.floor(a / 100) + Math.floor(b / 100) + c2}`);
  s.push(`Sonuç: ${a + b}`);
  return s;
}

function subSteps(a, b) {
  const s = [];
  let borrow = 0;
  const a1 = a % 10, b1 = b % 10;
  if (a1 < b1) { borrow = 1; s.push(`Birler: ${a1} < ${b1}, onlardan 1 ödünç alınır: ${a1 + 10} − ${b1} = ${a1 + 10 - b1}`); }
  else s.push(`Birler: ${a1} − ${b1} = ${a1 - b1}`);
  const tensDigit = Math.floor(a / 10) % 10, b2 = Math.floor(b / 10) % 10;
  const x = tensDigit - borrow, lhs = borrow ? `${tensDigit} − 1 (ödünç)` : `${tensDigit}`;
  let borrow2 = 0;
  if (x < b2) { borrow2 = 1; s.push(`Onlar: ${lhs} < ${b2}, yüzlerden 1 ödünç alınır: ${x + 10} − ${b2} = ${x + 10 - b2}`); }
  else s.push(`Onlar: ${lhs} − ${b2} = ${x - b2}`);
  if (a >= 100) s.push(`Yüzler: ${Math.floor(a / 100)}${borrow2 ? " − 1 (ödünç)" : ""} − ${Math.floor(b / 100)} = ${Math.floor(a / 100) - borrow2 - Math.floor(b / 100)}`);
  s.push(`Sonuç: ${a - b}`);
  return s;
}

// ---------- Konular (1–4. sınıf) ----------
const TOPICS = [
  { id: "1-top-20", grade: "1. Sınıf", name: "Toplama (20'ye kadar)", gen() {
      const a = rnd(0, 19), b = rnd(0, 20 - a);
      return { q: `${a} + ${b} = ?`, a: `${a + b}`, steps: [`${a} ile ${b} toplanır: ${a + b}`] }; } },
  { id: "1-cik-20", grade: "1. Sınıf", name: "Çıkarma (20'ye kadar)", gen() {
      const a = rnd(0, 20), b = rnd(0, a);
      return { q: `${a} − ${b} = ?`, a: `${a - b}`, steps: [`${a} sayısından ${b} çıkarılır: ${a - b}`] }; } },
  { id: "1-sekil", grade: "1. Sınıf", name: "Geometri: kenar sayısı", gen() {
      const shapes = [["Üçgen", "üçgen'in", 3], ["Dörtgen", "dörtgen'in", 4], ["Beşgen", "beşgen'in", 5], ["Altıgen", "altıgen'in", 6]];
      const [name, , k] = shapes[rnd(0, 3)];
      return { q: `${name}'in kaç kenarı vardır?`, a: `${k}`, steps: [`${name} ${k} kenarlıdır.`] }; } },

  { id: "2-top-100", grade: "2. Sınıf", name: "Toplama (100'e kadar)", gen() {
      const a = rnd(10, 89), b = rnd(10, 100 - a);
      return { q: `${a} + ${b} = ?`, a: `${a + b}`, steps: [`Onlar: ${Math.floor(a / 10) * 10} + ${Math.floor(b / 10) * 10} = ${Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10}`, `Birler: ${a % 10} + ${b % 10} = ${a % 10 + b % 10}`, `Sonuç: ${a + b}`] }; } },
  { id: "2-cik-100", grade: "2. Sınıf", name: "Çıkarma (100'e kadar)", gen() {
      const a = rnd(10, 99), b = rnd(1, a);
      return { q: `${a} − ${b} = ?`, a: `${a - b}`, steps: subSteps(a, b) }; } },
  { id: "2-carpma-25", grade: "2. Sınıf", name: "Çarpma (2 ve 5 tablosu)", gen() {
      const a = rnd(0, 1) ? 5 : 2, b = rnd(2, 10);
      return { q: `${a} × ${b} = ?`, a: `${a * b}`, steps: [`${a} × ${b}, ${b} sayısının ${a} kez toplamıdır: ${Array(a).fill(b).join(" + ")} = ${a * b}`] }; } },
  { id: "2-para", grade: "2. Sınıf", name: "Para (TL, toplama)", gen() {
      const a = rnd(1, 100), b = rnd(1, 100);
      return { q: `${a} TL + ${b} TL = ? TL`, a: `${a + b}`, steps: [`${a} + ${b} = ${a + b} TL`] }; } },
  { id: "2-saat", grade: "2. Sınıf", name: "Zaman (saat, 12'lik)", gen() {
      const h = rnd(1, 12), k = rnd(1, 12);
      const ans = ((h + k - 1) % 12) + 1;
      return { q: `Saat ${h}'de ${k} saat sonra saat kaç olur?`, a: `${ans}`, steps: [`${h} + ${k} = ${h + k}`, `12'yi geçerse 12 çıkarılır: ${ans}`] }; } },

  { id: "3-top-1000", grade: "3. Sınıf", name: "Toplama (1000'e kadar, elde ile)", gen() {
      const a = rnd(100, 499), b = rnd(100, 499);
      return { q: `${a} + ${b} = ?`, a: `${a + b}`, steps: addSteps(a, b) }; } },
  { id: "3-cik-1000", grade: "3. Sınıf", name: "Çıkarma (1000'e kadar, ödünç ile)", gen() {
      const a = rnd(100, 999), b = rnd(10, a - 1);
      return { q: `${a} − ${b} = ?`, a: `${a - b}`, steps: subSteps(a, b) }; } },
  { id: "3-carpma-10", grade: "3. Sınıf", name: "Çarpma (2–10 tablosu)", gen() {
      const a = rnd(2, 10), b = rnd(2, 10);
      return { q: `${a} × ${b} = ?`, a: `${a * b}`, steps: [`${a} × ${b} = ${a * b}`] }; } },
  { id: "3-bolme", grade: "3. Sınıf", name: "Bölme (tam bölme)", gen() {
      const b = rnd(2, 10), q = rnd(2, 10), a = b * q;
      return { q: `${a} ÷ ${b} = ?`, a: `${q}`, steps: [`${b} × ${q} = ${a} olduğu için cevap ${q}`] }; } },

  { id: "4-carpma-2x1", grade: "4. Sınıf", name: "Çarpma (iki basamaklı × tek basamaklı)", gen() {
      const a = rnd(10, 99), b = rnd(2, 9), on = Math.floor(a / 10) * 10, bi = a % 10;
      return { q: `${a} × ${b} = ?`, a: `${a * b}`, steps: [`${a} = ${on} + ${bi}`, `${on} × ${b} = ${on * b}`, `${bi} × ${b} = ${bi * b}`, `Toplam: ${on * b} + ${bi * b} = ${a * b}`] }; } },
  { id: "4-bolme-2d", grade: "4. Sınıf", name: "Bölme (iki basamaklı bölünen)", gen() {
      const b = rnd(2, 9), q = rnd(10, 99), a = b * q;
      return { q: `${a} ÷ ${b} = ?`, a: `${q}`, steps: [`${b} × ${q} = ${a} olduğu için cevap ${q}`] }; } },
];

// ---------- İlerleme ----------
const STORE_KEY = "mat14_stats";
let stats = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
let currentTopic = null, current = null, answered = false;

const sOf = id => (stats[id] ||= { d: 0, t: 0 });
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(stats));

// ---------- Arayüz ----------
const $ = id => document.getElementById(id);
const topicsEl = $("topics"), qText = $("qText"), input = $("answer");
const checkBtn = $("checkBtn"), nextBtn = $("nextBtn"), feedback = $("feedback");

let lastGrade = "";
TOPICS.forEach(t => {
  if (t.grade !== lastGrade) {
    const h = document.createElement("h2"); h.textContent = t.grade; topicsEl.appendChild(h); lastGrade = t.grade;
  }
  const b = document.createElement("button");
  b.textContent = t.name; b.dataset.id = t.id;
  b.onclick = () => selectTopic(t.id);
  topicsEl.appendChild(b);
});
topicsEl.insertAdjacentHTML("afterbegin", "");

function selectTopic(id) {
  currentTopic = TOPICS.find(t => t.id === id);
  document.querySelectorAll(".topics button, #topics button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  nextQuestion();
}

function nextQuestion() {
  current = currentTopic.gen();
  answered = false;
  qText.textContent = current.q;
  input.value = ""; input.disabled = false; input.focus();
  checkBtn.disabled = false; checkBtn.classList.remove("hidden");
  nextBtn.classList.add("hidden");
  feedback.style.display = "none"; feedback.className = "feedback"; feedback.innerHTML = "";
  renderStats();
}

function check() {
  if (!current || answered) return;
  const val = input.value.trim().replace(",", ".");
  if (val === "") { input.focus(); return; }
  answered = true;
  const s = sOf(currentTopic.id);
  s.t++;
  const correct = val.toLowerCase() === current.a.toLowerCase();
  if (correct) s.d++;
  save(); renderStats();

  input.disabled = true; checkBtn.classList.add("hidden"); nextBtn.classList.remove("hidden");
  feedback.style.display = "block";
  if (correct) { feedback.className = "feedback ok"; feedback.innerHTML = "Tebrikler, doğru cevap!"; }
  else {
    feedback.className = "feedback bad";
    feedback.innerHTML = `Doğru cevap: <b>${current.a}</b><ol class="steps">` + current.steps.map(x => `<li>${x}</li>`).join("") + "</ol>";
  }
  nextBtn.focus();
}

function renderStats() {
  const s = currentTopic ? sOf(currentTopic.id) : { d: 0, t: 0 };
  $("correctCount").textContent = s.d;
  $("totalCount").textContent = s.t;
  $("rate").textContent = s.t ? Math.round(s.d / s.t * 100) + "%" : "-";
}

checkBtn.onclick = check;
nextBtn.onclick = nextQuestion;
input.addEventListener("keydown", e => { if (e.key === "Enter") (answered ? nextQuestion() : check()); });

// Tarayıcıda çevrimdışı çalışsın ve uygulama olarak kurulabilsin.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
